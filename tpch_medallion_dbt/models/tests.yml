version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_sk
        tests:
          - unique
          - not_null

  - name: dim_supplier
    columns:
      - name: supplier_sk
        tests:
          - unique
          - not_null

  - name: dim_part
    columns:
      - name: part_sk
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_sk
        tests:
          - unique
          - not_null

  - name: fct_sales
    columns:
      - name: customer_sk
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_sk
      - name: supplier_sk
        tests:
          - relationships:
              to: ref('dim_supplier')
              field: supplier_sk
      - name: part_sk
        tests:
          - relationships:
              to: ref('dim_part')
              field: part_sk
      - name: order_date_sk
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: ship_date_sk
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_sk
